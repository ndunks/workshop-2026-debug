<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5ef" />
    <title>Debug Harder | NodePlus Workshop 2026</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Debug workshop home"><span class="brand-mark">N</span> NODE+<span class="brand-light">WORKSHOP</span></a>
        <span class="topbar-label"><span class="status-dot"></span> DEBUG HARDER <span class="topbar-number">/ 2026</span></span>
      </header>

      <main class="main">
        <section class="challenge" aria-label="Password challenge">
          <div class="challenge-top"><span>CLIENT LOCKER</span><span class="challenge-asterisk" aria-hidden="true">JS</span></div>
          <div class="challenge-content">
            <div class="result-mark" id="result-mark" aria-hidden="true">?</div>
            <h1 id="challenge-title">Can you see it<span>?</span></h1>
            <div class="signal-stage" aria-hidden="true"><div class="signal-orbit"><img id="signal-image" class="signal-image" alt="" /><span class="signal-scan"></span></div></div>
            <p class="challenge-copy" id="challenge-copy">debug harder..</p>
            <form id="password-form">
              <label for="password">PASSWORD</label>
              <div class="input-wrap">
                <input id="password" name="password" type="password" placeholder="Enter your answer" autocomplete="off" required disabled />
                <button class="visibility" id="visibility" type="button" aria-label="Show password" title="Show password" disabled>Show</button>
              </div>
              <button class="submit" id="submit" type="submit" disabled><span>Check password</span><span aria-hidden="true">↗</span></button>
              <p class="feedback" id="feedback" role="status" aria-live="polite">Initializing validator...</p>
            </form>
          </div>
          <div class="challenge-bottom"><span>LOCAL VALIDATION</span><span>SYSTEM <span class="bottom-dot">●</span> READY</span></div>
        </section>
      </main>

      <footer class="page-footer"><span>DEBUG HARDER</span><span>LOOK CLOSER</span></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
